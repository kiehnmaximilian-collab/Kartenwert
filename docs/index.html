<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kartenwert">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Kartenwert</title>
<style>
  :root { --bg:#f4f4f1; --fg:#1b1b19; --muted:#6a6a64; --card:#fff; --line:#e0e0da; --accent:#2f5bd3; --accent-fg:#fff;
          --warn:#9a6700; --err:#c0392b; --ok:#1f7a3d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#ecece8; --muted:#a0a09a; --card:#1f1f1d; --line:#33332f;
          --accent:#7d9bff; --accent-fg:#0b1020; --warn:#e3b341; --err:#ff7b72; --ok:#56d364; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,-apple-system,sans-serif }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
           display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line) }
  header h1 { font-size:1.15rem; margin:0; flex:1 }
  header button { margin:0 }
  main { max-width:640px; margin:0 auto; padding:16px 16px calc(40px + env(safe-area-inset-bottom)) }
  h2 { font-size:1.1rem; margin:0 0 8px }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:0 0 16px }
  .sub { color:var(--muted); font-size:.92rem }
  .warn { color:var(--warn) } .err { color:var(--err) } .ok { color:var(--ok) }
  button, .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 18px;
           border:0; border-radius:10px; background:var(--accent); color:var(--accent-fg); font:inherit; font-weight:600;
           cursor:pointer; text-decoration:none; margin-top:12px }
  button.sec, .btn.sec { background:transparent; color:var(--accent); border:1px solid var(--accent) }
  button.small { min-height:36px; padding:6px 12px; font-size:.9rem }
  button:disabled { opacity:.5 }
  .wide { width:100% }
  input[type=text], input[type=number], select { font:inherit; width:100%; min-height:42px; padding:8px 10px; border:1px solid var(--line);
           border-radius:8px; background:var(--bg); color:var(--fg) }
  label.f { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px }
  .row { display:flex; gap:8px; align-items:flex-end } .row > * { flex:1 }
  .stage { position:relative; touch-action:none; user-select:none; -webkit-user-select:none }
  .stage canvas { width:100%; display:block; border-radius:8px; background:#000 }
  .handle { position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; border:3px solid #fff;
            background:rgba(47,91,211,.55); box-shadow:0 0 0 1px rgba(0,0,0,.5) }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:10px }
  .pair canvas, .pair img { width:100%; border-radius:6px; display:block }
  .cond { display:inline-block; font-size:1.7rem; font-weight:800; padding:2px 14px; border-radius:10px; background:var(--accent); color:var(--accent-fg) }
  .q { margin:14px 0 } .q p { margin:0 0 6px; font-weight:600 }
  .opts { display:flex; flex-wrap:wrap; gap:6px }
  .opts label { flex:1 1 auto; text-align:center; padding:9px 10px; border:1px solid var(--line); border-radius:8px; cursor:pointer; font-size:.92rem }
  .opts input { display:none }
  .opts input:checked + span { font-weight:700 }
  .opts label:has(input:checked) { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent) }
  ul.reasons { margin:8px 0 0; padding-left:18px } ul.reasons li { margin:2px 0 }
  .tag { display:inline-block; min-width:30px; text-align:center; font-size:.75rem; font-weight:700; border-radius:4px; padding:0 4px;
         background:var(--line); margin-right:6px }
  .hist { display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); cursor:pointer }
  .hist:first-child { border-top:0 }
  .hist img { width:46px; height:67px; object-fit:cover; border-radius:4px; background:var(--line) }
  .hist .t { flex:1; min-width:0 } .hist .t b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .price { font-weight:700; white-space:nowrap }
  .progress { display:flex; align-items:center; gap:10px }
  .spinner { width:20px; height:20px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:spin 1s linear infinite }
  @keyframes spin { to { transform:rotate(360deg) } }
  .cam { position:fixed; inset:0; z-index:50; background:#000; overflow:hidden }
  .cam video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
  .cam .frame { position:absolute; border:3px solid #fff; border-radius:14px; box-shadow:0 0 0 200vmax rgba(0,0,0,.55); pointer-events:none }
  .cam .frame i { position:absolute; width:28px; height:28px; border:5px solid #4f7bff }
  .cam .frame i:nth-child(1) { left:-6px; top:-6px; border-right:0; border-bottom:0; border-top-left-radius:14px }
  .cam .frame i:nth-child(2) { right:-6px; top:-6px; border-left:0; border-bottom:0; border-top-right-radius:14px }
  .cam .frame i:nth-child(3) { left:-6px; bottom:-6px; border-right:0; border-top:0; border-bottom-left-radius:14px }
  .cam .frame i:nth-child(4) { right:-6px; bottom:-6px; border-left:0; border-top:0; border-bottom-right-radius:14px }
  .cam .hint { position:absolute; left:16px; right:16px; top:calc(10px + env(safe-area-inset-top)); margin:0; color:#fff; text-align:center; font-weight:600; text-shadow:0 1px 3px #000 }
  .cam .bar { position:absolute; left:0; right:0; bottom:0; padding:16px 16px calc(20px + env(safe-area-inset-bottom));
              display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px }
  .cam .bar .sec { color:#fff; border-color:#fff; margin:0; justify-self:start }
  .cam .shutter { width:76px; height:76px; border-radius:50%; background:#fff; border:6px solid rgba(255,255,255,.4); background-clip:padding-box; margin:0; padding:0 }
  [hidden] { display:none !important }
  .tips li { margin:3px 0 }
</style>
</head>
<body>
<header><h1 id="title">Kartenwert</h1><button class="sec small" id="home" hidden>Übersicht</button></header>
<main id="app"></main>
<script type="module" src="js/main.js"></script>
</body>
</html>
